# fly.toml — Baar (Armenian Contexto)
# Docs: https://fly.io/docs/reference/configuration/
#
# `app` must be globally unique on Fly; `fly launch` will set/confirm it.
app = "baar"
primary_region = "fra"   # Frankfurt — closest Fly region to Armenia

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to minimise cost; auto-start on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # holds the ~315MB vector table + app; bump to 1gb if needed

# A little swap as a safety net for the lazy 315MB load under 512MB RAM.
swap_size_mb = 512
